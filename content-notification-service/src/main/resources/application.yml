server:
  port: 8080

spring:
  application:
    name: content-notification-service
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/contentNotificationService?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.content.contentNotificationService.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.content.contentNotificationService: debug
    com.baomidou.mybatisplus: debug
